function initAudio(){
  try{
    if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();}
    if(ac.state==='suspended')ac.resume().catch(()=>{});
  }catch(e){ac=null;}
}
function snd(f,d=.1,type='square',v=.04,f2){
  if(muted||!f||!ac||ac.state!=='running')return;
  try{
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

  const h=rows.length,w=rows[0].length,c=mk(w*s,h*s),g=c.getContext('2d');

}

function pw(l){
  let h=2166136261;const s='CSR-8BIT-'+l;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return 'S'+String(l).padStart(2,'0')+'-'+((h>>>0).toString(36).toUpperCase().padStart(7,'0').slice(0,5));
}

let bg=null,bgLevel=-1;
function buildBg(l){
  const L=LV[(l-1)%LV.length];
  const sky=mk(W,H),g=sky.getContext('2d');
  g.fillStyle=L.sky[0];g.fillRect(0,0,W,Math.floor(GY*0.55));
  g.fillStyle=L.sky[1];g.fillRect(0,Math.floor(GY*0.55),W,Math.ceil(GY*0.45));
  const far=mk(W,H),f=far.getContext('2d');
  f.fillStyle=L.build;
  let x=0;
  while(x<W){
    if(L.id==='hp'||L.id==='lotr'){
      const w=30+Math.floor(rnd(0,3))*10,hg=42+Math.floor(rnd(0,52));
      f.beginPath();f.moveTo(x,GY);f.lineTo(x+w/2,GY-hg);f.lineTo(x+w,GY);f.fill();
      f.fillStyle='#fde047';f.fillRect(x+w/2-2,GY-hg+14,4,6);f.fillStyle=L.build;
    }else if(L.id==='tw'||L.id==='hg'||L.id==='jp'){
      const w=18+Math.floor(rnd(0,2))*6,hg=38+Math.floor(rnd(0,35));
      f.fillStyle='#451a03';f.fillRect(x+w/2-2,GY-12,4,12);
      f.fillStyle=L.build;
      f.beginPath();f.moveTo(x+w/2,GY-hg);f.lineTo(x,GY-8);f.lineTo(x+w,GY-8);f.fill();
    }else if(L.id==='potc'){
      const w=26,hg=28+Math.floor(rnd(0,16));
      f.fillStyle='#78350f';f.fillRect(x,GY-10,w,10);
      f.fillRect(x+11,GY-hg,3,hg);
      f.fillStyle='#f8fafc';f.fillRect(x+4,GY-hg+4,16,12);
      f.fillStyle=L.build;
    }else if(L.id==='mx'){
      f.fillStyle='#22c55e';
      for(let my=8;my<GY-10;my+=14)if(Math.random()<0.6)f.fillRect(x,my,3,8);
      f.fillStyle=L.build;
    }else{
      const w=22+Math.floor(rnd(0,3))*8,hg=28+Math.floor(rnd(0,45));
      f.fillRect(x,GY-hg,w,hg);
      f.fillStyle='#fde047';
      for(let yy=GY-hg+6;yy<GY-6;yy+=8)
        for(let xx=x+4;xx<x+w-4;xx+=6)if((xx+yy)%3!==0)f.fillRect(xx,yy,3,4);
      f.fillStyle=L.build;
    }
    x+=Math.max(14,22+Math.floor(rnd(-4,12)));
  }
  const tileH=Math.max(40,H-GY),tile=mk(24,tileH),t=tile.getContext('2d');
  t.fillStyle=L.ground[0];t.fillRect(0,0,24,5);
  t.fillStyle=L.ground[1];t.fillRect(0,5,24,tileH-5);
  t.fillStyle='rgba(0,0,0,0.22)';
  for(let ty=14;ty<tileH;ty+=10){
    t.fillRect(0,ty,24,2);t.fillRect(((Math.floor(ty/10)%2)*12)+6,ty-8,2,8);
  }
  bgLevel=l;
  return {sky,far,tile};
}

function resize(){
  const vw=Math.max(300,window.innerWidth||document.documentElement.clientWidth||360);
  const vh=Math.max(360,window.innerHeight||document.documentElement.clientHeight||640);
  const newIsPortrait=vh>vw;
  let newW,newH,newGY;
  if(newIsPortrait){newW=260;newH=Math.max(360,Math.min(540,Math.round(newW*(vh/vw))));newGY=Math.round(newH*0.64);}
  else{newH=225;newW=Math.max(340,Math.min(540,Math.round(newH*(vw/vh))));newGY=Math.round(newH*0.76);}
  const changed=(newW!==W||newH!==H||newGY!==GY);
  W=newW;H=newH;GY=newGY;isPortrait=newIsPortrait;
  cv.width=W;cv.height=H;
  ctx.imageSmoothingEnabled=false;
  if(changed||bgLevel!==level){bg=buildBg(level);if(p.y>GY-24)p.y=GY-24;}
}

function templeAction(act){
  if(mode!=='temple')return;
  const turnObj=tr.objs.find(o=>o.t==='turn'&&!o.done&&o.z<0.60&&o.z>-0.06);
  if(act==='left'){
    if(turnObj){
      if(turnObj.dir===-1){
        turnObj.done=true;bonus+=500;tr.pts+=500;tr.targetCurve=-26;
        setTimeout(()=>{tr.targetCurve=0;},500);
        pops.push({x:W/2,y:H*0.36,t:'SVOLTA SX OK! +500',c:'#0a7d42',l:38});
        arp([587,880,1174],.08,55);return;
      }else if(turnObj.z<0.25){endTempleBonus(true);return;}
    }
    if(tr.lane>0){tr.lane--;snd(420,.06,'square',.04,560);}
  }else if(act==='right'){
    if(turnObj){
      if(turnObj.dir===1){
        turnObj.done=true;bonus+=500;tr.pts+=500;tr.targetCurve=26;
        setTimeout(()=>{tr.targetCurve=0;},500);
        pops.push({x:W/2,y:H*0.36,t:'SVOLTA DX OK! +500',c:'#0a7d42',l:38});
        arp([587,880,1174],.08,55);return;
      }else if(turnObj.z<0.25){endTempleBonus(true);return;}
    }
    if(tr.lane<2){tr.lane++;snd(420,.06,'square',.04,560);}
  }else if(act==='center'){tr.lane=1;snd(460,.06,'square',.04,600);}
  else if(act==='up'){if(tr.jumpT<=0){tr.jumpT=tr.jumpMax;tr.duckT=0;snd(380,.12,'square',.05,760);}}
  else if(act==='down'){if(tr.duckT<=0){tr.duckT=tr.duckMax;tr.jumpT=0;snd(260,.12,'triangle',.05,150);}}
}

function spawnTempleRow(prog){
  if(prog>0.20&&Math.random()<0.20){tr.objs.push({t:'turn',dir:Math.random()<0.5?-1:1,z:1.0,done:false});return;}
  if(prog<0.35){tr.objs.push({t:(Math.random()<0.45?'low':(Math.random()<0.75?'wall':'high')),lane:Math.floor(rnd(0,3)),z:1.0});tr.objs.push({t:'coin',lane:Math.floor(rnd(0,3)),z:1.0});return;}
  const freeLane=Math.floor(rnd(0,3)),pat=Math.floor(rnd(0,4));
  for(let l=0;l<3;l++){
    if(l===freeLane)tr.objs.push({t:'coin',lane:l,z:1.0});
    else if(pat===0)tr.objs.push({t:'low',lane:l,z:1.0});
    else if(pat===1)tr.objs.push({t:'high',lane:l,z:1.0});
    else if(pat===2)tr.objs.push({t:'wall',lane:l,z:1.0});
  }
  if(pat===3){tr.objs.push({t:'wall',lane:0,z:1.0});tr.objs.push({t:'low',lane:1,z:1.0});tr.objs.push({t:'coin',lane:2,z:1.0});}
}

function updateTemple(dt){
  tr.time-=dt;if(tr.introT>0)tr.introT-=dt;
  if(tr.time<=0){endTempleBonus(false);return;}
  bgmTimer-=dt;
  if(bgmTimer<=0){
    const sM=SAGA_BGM[(level-1)%SAGA_BGM.length];bgmTimer=sM.t*0.65;
    const n=sM.n[melIdx%sM.n.length];if(n>0)snd(n*1.25,0.09,'square',0.038);melIdx++;
  }
  const prog=1-(tr.time/tr.maxTime),scC=Math.pow(prog,1.3);
  tr.zSpeed=(0.0085+scC*0.0090)*dt;tr.scrollZ=(tr.scrollZ+tr.zSpeed*10)%1;
  tr.laneX+=(tr.lane-1-tr.laneX)*Math.min(1,0.26*dt);tr.curve+=(tr.targetCurve-tr.curve)*Math.min(1,0.12*dt);
  if(tr.jumpT>0)tr.jumpT=Math.max(0,tr.jumpT-dt);if(tr.duckT>0)tr.duckT=Math.max(0,tr.duckT-dt);
  if(tr.introT<=0){tr.spawnT-=dt;if(tr.spawnT<=0){spawnTempleRow(prog);tr.spawnT=Math.max(32,58-prog*26);}}
  for(const o of tr.objs){
    o.z-=tr.zSpeed;
    if(!o.passed&&o.z<=0.055&&o.z>=-0.025){
      if(o.t==='turn'){if(o.z<=0.0&&!o.done){endTempleBonus(true);return;}}
      else if(o.lane===tr.lane){
        if(o.t==='coin'){o.passed=true;bits++;bonus+=100;tr.pts+=100;pops.push({x:W/2+(o.lane-1)*45,y:H*0.62,t:'+100',c:'#d97706',l:26});snd(987,.07,'square',.045,1318);}
        else if(o.t==='low'&&tr.jumpT>2){o.passed=true;bonus+=150;tr.pts+=150;pops.push({x:W/2,y:H*0.55,t:'SALTO OK! +150',c:'#0a7d42',l:22});}
        else if(o.t==='high'&&tr.duckT>2){o.passed=true;bonus+=150;tr.pts+=150;pops.push({x:W/2,y:H*0.55,t:'SCIVOLATA! +150',c:'#0b65c6',l:22});}
        else if(o.t==='wall'||o.t==='low'||o.t==='high'){endTempleBonus(true);return;}
      }
    }
  }
  tr.objs=tr.objs.filter(o=>!(o.t==='coin'&&o.passed)&&o.z>-0.12);
  for(const q of pops){q.y-=0.55*dt;q.l-=dt;}pops=pops.filter(q=>q.l>0);
}

function drawTemple(){
  fN++;const L=LV[level-1],bt=L.bTheme,bO=L.bObs;
  const hzY=Math.round(H*0.27),botY=isPortrait?Math.round(H*0.82):Math.round(H*0.84),playerY=botY-18;
  ctx.fillStyle=bt.sky;ctx.fillRect(0,0,W,hzY);
  for(let i=0;i<bt.curb.length;i++){ctx.fillStyle=bt.curb[i];ctx.fillRect(0,hzY-8+i*3,W,3);}
  ctx.fillStyle=bt.grass;ctx.fillRect(0,hzY,W,H-hzY);
  const topW=44,botW=Math.min(W*0.92,260),slices=26;
  for(let i=0;i<slices;i++){
    const z1=1-(i/slices),z2=1-((i+1)/slices),p1=Math.pow(1-z1,1.45),p2=Math.pow(1-z2,1.45);
    const y1=hzY+p1*(botY-hzY),y2=hzY+p2*(botY-hzY),w1=topW+p1*(botW-topW),w2=topW+p2*(botW-topW);
    const c1=tr.curve*(1-p1),c2=tr.curve*(1-p2),stripe=((Math.floor((z1*12)+tr.scrollZ*2))%2===0);
    ctx.fillStyle=bt.grass;ctx.fillRect(0,Math.floor(y1),W,Math.ceil(y2-y1)+1);
    ctx.fillStyle=stripe?bt.road:'#e2e8f0';ctx.beginPath();ctx.moveTo(W/2+c1-w1/2,y1);ctx.lineTo(W/2+c1+w1/2,y1);ctx.lineTo(W/2+c2+w2/2,y2);ctx.lineTo(W/2+c2-w2/2,y2);ctx.fill();
    const curbCol=bt.curb[(i+Math.floor(fN/6))%bt.curb.length];ctx.fillStyle=curbCol;ctx.fillRect(Math.round(W/2+c1-w1/2-5),Math.round(y1),5,Math.ceil(y2-y1)+1);ctx.fillRect(Math.round(W/2+c1+w1/2),Math.round(y1),5,Math.ceil(y2-y1)+1);
    if(stripe){ctx.fillStyle='#475569';const l1=W/2+c1-w1/6,r1=W/2+c1+w1/6;ctx.fillRect(Math.round(l1)-1,Math.round(y1),2,Math.ceil(y2-y1));ctx.fillRect(Math.round(r1)-1,Math.round(y1),2,Math.ceil(y2-y1));}
  }
  const sorted=[...tr.objs].sort((a,b)=>b.z-a.z);
  for(const o of sorted){
    if(o.z<0||o.z>1)continue;
    const pSc=Math.pow(1-o.z,1.45),sy=hzY+pSc*(playerY-hzY),rw=topW+pSc*(botW-topW),cxCenter=W/2+tr.curve*(1-pSc),sc=0.26+pSc*0.92;
    if(o.t==='turn'){
      const bh=Math.max(10,Math.round(24*sc));ctx.fillStyle=o.done?'#22c55e':(fN%8<4?'#ffd84a':'#f97316');ctx.fillRect(Math.round(cxCenter-rw/2),Math.round(sy-bh),Math.round(rw),bh);
      ctx.fillStyle='#142238';ctx.font=`bold ${Math.max(8,Math.round(12*sc))}px "Courier New",monospace`;ctx.textAlign='center';ctx.fillText(o.dir===-1?'<<< CURVA SX':'CURVA DX >>>',cxCenter,Math.round(sy-bh*0.72));
      continue;
    }
    const laneX=cxCenter+(o.lane-1)*(rw/3),laneW=Math.max(10,Math.round((rw/3)*0.82));
    if(o.t==='coin'){const cw=Math.max(7,Math.round(17*sc));ctx.drawImage(S.oscar,Math.round(laneX-cw/2),Math.round(sy-cw-3*sc),cw,cw);}
    else{
      let oh=0,ry=0,tTxt='';
      if(o.t==='low'){oh=Math.max(7,Math.round(16*sc));ry=Math.round(sy-oh);ctx.fillStyle=bO.low[1];ctx.fillRect(Math.round(laneX-laneW/2),ry,laneW,oh);tTxt=bO.low[0];}
      else if(o.t==='high'){oh=Math.max(16,Math.round(42*sc));ry=Math.round(sy-oh);ctx.fillStyle=bO.high[1];ctx.fillRect(Math.round(laneX-laneW/2),ry,laneW,oh);tTxt=bO.high[0];}
      else if(o.t==='wall'){oh=Math.max(14,Math.round(36*sc));ry=Math.round(sy-oh);ctx.fillStyle=bO.wall[1];ctx.fillRect(Math.round(laneX-laneW/2),ry,laneW,oh);tTxt=bO.wall[0];}
      ctx.strokeStyle='#142238';ctx.strokeRect(Math.round(laneX-laneW/2),ry,laneW,oh);
      if(sc>0.55){ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(6,Math.round(7*sc))}px "Courier New",monospace`;ctx.textAlign='center';ctx.fillText(tTxt,laneX,ry+Math.round(oh/2));}
    }
  }
  const px=W/2+tr.laneX*(botW/3),jumpArc=tr.jumpT>0?Math.sin((1-tr.jumpT/tr.jumpMax)*Math.PI)*38:0,isDuck=tr.duckT>0,pwC=isDuck?30:26,phC=isDuck?14:26;
  ctx.fillStyle='rgba(0,0,0,0.32)';ctx.fillRect(Math.round(px-12),playerY-2,24,4);
  ctx.drawImage(pl2,Math.round(px-pwC/2),Math.round(playerY-phC-jumpArc),pwC,phC);
  ctx.textAlign='center';ctx.font='bold 9px "Courier New",monospace';
  for(const q of pops){ctx.fillStyle='#ffffff';ctx.fillText(q.t,Math.round(q.x)+1,Math.round(q.y)+1);ctx.fillStyle=q.c;ctx.fillText(q.t,Math.round(q.x),Math.round(q.y));}
  const nearTurn=tr.objs.find(o=>o.t==='turn'&&!o.done&&o.z<0.55&&o.z>0);
  if(nearTurn){ctx.fillStyle='#fff';ctx.fillRect(W/2-96,hzY-26,192,18);ctx.fillStyle='#d92638';ctx.fillText(nearTurn.dir===-1?'<<< SWIPE O TOCCA SX! <<<':'>>> SWIPE O TOCCA DX! >>>',W/2,hzY-21);}
  else if(tr.introT>0){ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fillRect(W/2-116,hzY+8,232,32);ctx.fillStyle='#b91c1c';ctx.fillText(L.bonusName,W/2,hzY+13);ctx.fillStyle='#142238';ctx.fillText('◀ ▶ CORSIA/CURVA · ▲ SALTA · ▼ GIÙ',W/2,hzY+25);}
  ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fillRect(6,6,178,38);ctx.fillStyle='#b91c1c';ctx.fillText(L.bonusName,12,16);ctx.fillStyle='#0a7d42';ctx.fillText('BONUS: +'+tr.pts,12,27);ctx.fillStyle='#f59e0b';ctx.fillRect(12,33,Math.max(0,Math.round((tr.time/tr.maxTime)*162)),3);
  const btnY=botY+4,btnH=H-botY-6,btnW=Math.floor((W-16)/5);
  const labels=['◀ SX','● CTR','▲ SU','▼ GIÙ','DX ▶'];
  ctx.textAlign='center';ctx.font='bold 8px "Courier New",monospace';
  for(let i=0;i<5;i++){
    const bx=4+i*(btnW+2);
    ctx.fillStyle='#ffffff';ctx.fillRect(bx,btnY,btnW,btnH);ctx.strokeStyle='#142238';ctx.strokeRect(bx,btnY,btnW,btnH);
    ctx.fillStyle='#142238';ctx.fillText(labels[i],bx+btnW/2,btnY+Math.max(4,Math.floor((btnH-8)/2)));
  }
  ctx.textAlign='left';
}

// ---------- SALTO (triplo salto solo se boss non attivo) ----------
function jump(){
  if(mode!=='play')return;
  initAudio();
  if(p.onCloud){
    snd(720,.1,'square',.08,1200);
    p.vy=-6.5;p.onCloud=false;p.j=2;p.cloudTimer=0;return;
  }
  if(p.j===0){
    snd(350,.11,'square',.08,680);
    p.vy=-9.2;p.j=1;jbuf=0;
  }else if(p.j===1){
    snd(560,.12,'square',.09,1120);
    burst(p.x+12,p.y+22,'#facc15',8);
    p.vy=-8.6;p.j=2;jbuf=0;
  }else if(p.j===2&&level===11&&!boss){
    snd(880,.22,'square',.1,1760);
    burst(p.x+12,p.y+22,'#38bdf8',18);
    p.vy=-11.8;p.j=3;jbuf=0;
  }else{
    jbuf=12;
  }
}

const hit=(a,b,m=2)=>a.x+m<b.x+b.w-m&&a.x+a.w-m>b.x+m&&a.y+m<b.y+b.h-m&&a.y+a.h-m>b.y+m;
function burst(x,y,c,n=10){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-2.8,2.8),vy:rnd(-3.8,1),l:rnd(18,34),c});}
function damage(){
  if(hurt>0||inv>0)return;
  hurt=85;lives--;lost++;combo=0;shake=14;
  snd(130,.28,'sawtooth',.12,55);
  burst(p.x+12,p.y+12,'#e62e3d',15);
  if(lives<=0)gameOver();
}
function isFreeX(x,m=26){
  for(const o of obs)if(Math.abs((o.x+o.w/2)-x)<m)return false;
  for(const i of items)if(Math.abs((i.x+i.w/2)-x)<m)return false;
  return true;
}

function spawnObstacle(){
  const L=LV[level-1],r=Math.random();let o;
  const airChance=Math.min(0.55,0.25+(level-1)*0.03);
  if(r>airChance)o={s:getS(L.id+'_g'),v:1,air:0};
  else o={s:getS(L.id+'_a'),v:1.15,air:1};
  o.w=o.s.width;o.h=o.s.height;o.x=W+20;o.y=o.air?(GY-48):(GY-o.h);obs.push(o);
  if(lives<5&&Math.random()<0.14&&isFreeX(W+95,28))items.push({t:'heart',s:S.heart,x:W+95,y:GY-64,w:S.heart.width,h:S.heart.height});
}

function spawnCoins(){
  if(level===11){
    const bX=W+25;
    for(let k=0;k<5;k++)items.push({t:'bit',s:S.popcorn,x:bX+k*18,y:CLOUD_Y-16,w:14,h:14});
    return;
  }
  const lane=Math.random()<0.34?0:(Math.random()<0.52?1:2),bX=W+25;
  for(let k=0;k<5;k++){const cx=bX+k*18,arc=Math.sin((k/4)*Math.PI),cyPos=lane===0?GY-18:(lane===1?GY-52-arc*22:GY-104-arc*24);if(isFreeX(cx,14))items.push({t:'bit',s:S.popcorn,x:cx,y:cyPos,w:14,h:14});}
}

function update(dt){
  const L=LV[level-1],isFinal=(level===11);
  const levelDurationSec=isFinal?120:45;
  const maxLs=(L.boss&&!bossDone)?995:1000;
  ls=Math.min(maxLs,ls+(1000/(levelDurationSec*60))*dt);
  const prog=Math.min(1,ls/1000),st=Math.min(Math.floor(ls/200),4);
  if(st>lastSt&&mode==='play'){lastSt=st;msg='AZIONE UP!';msgT=65;snd(480,.14,'square',.07,920);}

  const targetSpd=isFinal?4.2:(L.baseSpd+prog*0.35);
  speed+=(targetSpd-speed)*Math.min(1,0.05*dt);
  const sp=speed*dt,G=inv>0,ph=G?48:24;scroll+=sp;

  // BGM
  bgmTimer-=dt;
  if(bgmTimer<=0){
    if(G){
      bgmTimer=7.5;
      snd(SUPER_MELODY[melIdx%SUPER_MELODY.length],0.12,'square',0.08);
      melIdx++;
    }else{
      const sM=SAGA_BGM[(level-1)%SAGA_BGM.length];
      bgmTimer=sM.t;
      const n=sM.n[melIdx%sM.n.length];
      if(n>0){snd(n,0.18,sM.w,0.08);if(melIdx%2===0)snd(n*0.5,0.2,'triangle',0.05);}
      melIdx++;
    }
  }

  // Fisica
  p.vy+=0.55*dt;
  p.y+=p.vy*dt;
  // Soft ceiling: evita di uscire troppo in alto
  if(p.y<-50){p.y=-50;if(p.vy<0)p.vy=0;}
  if(jbuf>0)jbuf-=dt;

  // Atterraggio nuvola: SOLO se triplo salto fatto e boss non attivo
  if(isFinal&&!boss&&p.vy>=0&&p.y+ph>=CLOUD_Y&&p.y+ph<=CLOUD_Y+20&&p.j>=3){
    const wasOnCloud=p.onCloud;
    p.y=CLOUD_Y-ph;p.vy=0;p.onCloud=true;p.cloudTimer=180;wasAir=false;p.j=0;p.coyote=6;
    if(!wasOnCloud){
      msg='★ SEGRETO DELLE NUVOLE RIVELATO! ★';msgT=140;
      burst(p.x+12,p.y+ph/2,'#ffd84a',24);
      arp([523,659,784,1047,1318,1568],.14,70);
    }
    if(jbuf>0){jbuf=0;jump();}
  }else if(isFinal&&p.onCloud&&!boss){
    p.cloudTimer-=dt;
    if(p.cloudTimer<=0){
      p.onCloud=false;
    }else{
      p.y=CLOUD_Y-ph;p.vy=0;
    }
  }else if(p.y+ph>=GY){
    p.y=GY-ph;p.vy=0;p.j=0;p.onCloud=false;p.coyote=6;
    if(wasAir){burst(p.x+ph/2,GY-2,'#cbd5e1',6);wasAir=false;}
    if(jbuf>0){jbuf=0;jump();}
  }else{
    wasAir=true;
    if(p.coyote>0)p.coyote-=dt;
  }

  if(hurt>0)hurt-=dt;
  if(inv>0){inv-=dt;if(inv<=0)superStreak=0;}
  if(msgT>0)msgT-=dt;
  if(tutT>0)tutT-=dt;
  if(shake>0)shake-=dt;

  // Boss spawn
  if(L.boss&&!boss&&!bossDone&&ls>=666){
    boss={x:W+40,y:GY-42,w:42,h:42,st:'in',passes:0,t:0,shot:0,hp:isFinal?6:undefined,maxHp:isFinal?6:undefined};
    obs=[];
    // Se il giocatore è sulla nuvola, il boss lo costringe a terra
    if(p.onCloud){
      p.onCloud=false;
      p.vy=2;
      msg='IL BOSS TI COSTRINGE A TERRA!';msgT=110;
    }else{
      msg=isFinal?'⚠ BOSS FINALE: '+L.boss.toUpperCase()+' ⚠':'BOSS: '+L.boss.toUpperCase()+'!';
      msgT=140;
    }
    arp([220,196,175,147],.15,90);
  }

  // Boss logica
  if(boss){
    if(boss.st==='in'){
      boss.x-=2.5*dt;
      if(boss.x<=W-58){boss.st='wait';boss.t=isFinal?90:Math.max(45,70-(level-1)*3);boss.shot=0;}
    }else if(boss.st==='wait'){
      boss.t-=dt;
      boss.y=GY-42-Math.abs(Math.sin(fN/9))*6;
      if(isFinal){
        if(boss.shot===0&&boss.t<75){
          boss.shot=1;
          const s=getS(L.id+'_g');
          obs.push({s,v:1.4,x:boss.x-6,w:s.width,h:s.height,y:GY-s.height,air:0});
          snd(240,.14,'sawtooth',.09,120);
        }
        if(boss.shot===1&&boss.t<50){
          boss.shot=2;
          const s=getS(L.id+'_a');
          obs.push({s,v:1.4,x:boss.x-6,w:s.width,h:s.height,y:GY-50,air:1});
          snd(320,.14,'sawtooth',.09,160);
        }
        if(boss.shot===2&&boss.t<25){
          boss.shot=3;
          const s=getS(L.id+'_g');
          obs.push({s,v:1.6,x:boss.x-6,w:s.width,h:s.height,y:GY-s.height,air:0});
          snd(400,.14,'sawtooth',.09,200);
        }
      }else{
        if(!boss.shot&&boss.t<30){
          boss.shot=1;
          const air=boss.passes%2===1,s=getS(L.id+(air?'_a':'_g'));
          obs.push({s,v:1.35+(level-1)*0.03,x:boss.x-6,w:s.width,h:s.height,y:air?GY-46:GY-s.height,air});
          snd(240,.14,'sawtooth',.09,120);
        }
      }
      if(boss.t<=0){boss.st='charge';boss.y=GY-42;}
    }else if(boss.st==='charge'){
      boss.x-=(speed+3.4+(level-1)*0.1)*dt;
      const pbBoss={x:p.x,y:p.y,w:ph,h:ph};
      if(isFinal&&boss.hp!==undefined){
        if(hit(pbBoss,boss,2)){
          const playerBottom=p.y+ph;
          if(p.vy>0&&playerBottom<boss.y+boss.h*0.6&&!p.onCloud){
            boss.hp--;
            p.y=boss.y-ph;p.vy=-9.5;p.j=0;
            burst(boss.x+boss.w/2,boss.y+4,'#ffd84a',15);
            snd(900,.15,'square',.1,1800);
            pops.push({x:boss.x+boss.w/2,y:boss.y-12,t:'STOMP!',c:'#ffd84a',l:45});
            if(boss.hp<=0){
              const ex=boss.x+boss.w/2,ey=boss.y+boss.h/2;
              boss=null;bossDone=true;obs=[];hurt=60;
              bonus+=2000;
              burst(ex,ey,'#ffd84a',40);
              msg='★ '+L.boss.toUpperCase()+' SCONFITTO! ★';msgT=150;
              items.push({t:'heart',s:S.heart,x:W+12,y:GY-44,w:S.heart.width,h:S.heart.height});
              arp([392,523,659,784,1047,1318],.14,85);
            }
          }else if(hurt<=0){
            damage();
            if(mode!=='play')return;
          }
        }
      }else if(hit(pbBoss,boss,5)&&hurt<=0){
        damage();
        if(mode!=='play')return;
      }
      if(boss&&boss.x<-boss.w){
        boss.passes++;
        if(boss.passes>=L.bossPasses){
          boss=null;bossDone=true;obs=[];hurt=60;
          burst(W/2,GY-30,'#ffd84a',36);
          msg=isFinal?L.boss.toUpperCase()+' SI RITIRA...':L.boss.toUpperCase()+' SCONFITTO!';
          msgT=140;
          items.push({t:'heart',s:S.heart,x:W+12,y:GY-44,w:S.heart.width,h:S.heart.height});
          arp([392,523,659,784,1047],.14,85);
        }else{boss.st='in';boss.x=W+36;}
      }
    }
    // Timeout boss: si ritira quando ls raggiunge 995
    if(boss&&ls>=995&&!bossDone){
      boss=null;bossDone=true;obs=[];hurt=60;
      burst(W/2,GY-30,'#ffd84a',30);
      msg=isFinal?L.boss.toUpperCase()+' SI RITIRA...':L.boss.toUpperCase()+' SCONFITTO!';
      msgT=140;
    }
  }else if(!(L.boss&&ls>=666&&!bossDone)){
    // Spawn ostacoli
    nextSpawnDist-=sp;
    if(nextSpawnDist<=0){
      spawnObstacle();
      if(isFinal&&!boss){
        // LIVELLO 11: impossibile a terra dopo grace period → obbliga nuvole
        if(ls<120) nextSpawnDist=rnd(120,160); // grace period: ostacoli normali
        else nextSpawnDist=rnd(19,21); // MURO CONTIGUO: sopravvivenza solo in alto
      } else if(isFinal&&boss){
        nextSpawnDist=rnd(200,280);
      } else {
        const minGap=Math.max(38,150-(level-1)*10);
        const maxGap=Math.max(55,200-(level-1)*12);
        nextSpawnDist=rnd(minGap,maxGap);
      }
    }
    nextCoinDist-=sp;if(nextCoinDist<=0){spawnCoins();nextCoinDist=isFinal?90:rnd(110,160);}
    nextOscarDist-=sp;
    if(nextOscarDist<=0){
      items.push({t:'oscar',s:S.oscar,x:W+40,y:isFinal?CLOUD_Y-22:GY-126,w:S.oscar.width,h:S.oscar.height});
      nextOscarDist=rnd(220,310);
    }
  }

  if(!rbSpawned&&ls>=310&&!boss&&!isFinal){
    rbSpawned=true;
    items.push({t:'clap',s:S.clap,x:W+24,y:GY-88,w:S.clap.width,h:S.clap.height});
    msg='CIAK BONUS 3D IN ARRIVO!';msgT=85;
  }
  if(!pu5&&ls>=520&&!boss&&!isFinal){
    pu5=true;
    items.push({t:'megaphone',s:S.megaphone,x:W+16,y:GY-74,w:S.megaphone.width,h:S.megaphone.height});
  }

  const pb={x:p.x,y:p.y,w:ph,h:ph};
  for(const o of obs)o.x-=sp*(o.v||1);
  for(const i of items)i.x-=sp;
  for(const i of items){
    if(i.t==='bit'){
      const dx=(p.x+ph/2)-(i.x+6),dy=(p.y+ph/2)-(i.y+6),d=Math.hypot(dx,dy);
      if(d<42&&d>1){i.x+=dx/d*3.1*dt;i.y+=dy/d*3.1*dt;}
    }
  }

  for(const o of obs){
    if(hit(pb,o,2)){
      if(G){
        o.dead=1;superStreak++;
        bonus+=superStreak*100;
        pops.push({x:o.x,y:o.y,t:'+'+(superStreak*100),c:'#0b65c6',l:34});
        burst(o.x+o.w/2,o.y+o.h/2,'#ffd84a',14);
        snd(300+Math.min(superStreak,8)*80,.1,'square',.08,600);
      }else{o.dead=1;damage();if(mode!=='play')return;}
    }
  }

  for(const i of items){
    if(hit(pb,i,i.t==='bit'?-4:1)){
      i.dead=1;
      if(i.t==='heart'){lives=Math.min(5,lives+1);pops.push({x:i.x,y:i.y,t:'VITA +1',c:'#e62e3d',l:32});snd(700,.18,'triangle',.09,1200);}
      else if(i.t==='bit'){
        bits++;bonus+=10;combo++;
        pops.push({x:i.x,y:i.y,t:'+10',c:'#d97706',l:28});
        snd(880+Math.min(combo,8)*55,.06,'square',.06);
        if(combo%5===0){bonus+=50;msg='COMBO x'+combo+'!';msgT=65;burst(p.x+12,p.y,'#ffd84a',10);}
      }
      else if(i.t==='oscar'){
        oscarCount++;bonus+=250;burst(i.x+10,i.y+10,'#fbbf24',16);
        if(oscarCount%3===0){
          bonus+=1500;msg='PREMIO OSCAR +1500!';msgT=110;
          pops.push({x:i.x,y:i.y,t:'+1500!',c:'#0a7d42',l:45});
          arp([523,659,784,1047,1318],.13,75);
        }else{
          msg='OSCAR ('+(oscarCount%3)+'/3)!';msgT=80;
          pops.push({x:i.x,y:i.y,t:'+250',c:'#d97706',l:36});
          arp([587,784,987],.1,70);
        }
      }
      else if(i.t==='megaphone'){inv=invMax;superStreak=0;bgmTimer=0;msg='DIRECTOR SUPER MODE!';msgT=95;arp([523,659,784,1047],.12,70);}
      else if(i.t==='clap'){startTempleBonus();return;}
    }
  }

  obs=obs.filter(o=>!o.dead&&o.x+o.w>-16);
  items=items.filter(i=>!i.dead&&i.x+i.w>-16);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=0.18*dt;q.l-=dt;}parts=parts.filter(q=>q.l>0);
  for(const q of pops){q.y-=0.55*dt;q.l-=dt;}pops=pops.filter(q=>q.l>0);

  if(!pendingQuiz&&ls>=1000&&(!L.boss||bossDone)){
    pendingQuiz=true;
    startQuizCountdown();
  }
}

function draw(){
  if(mode==='temple'){drawTemple();return;}
  fN++;ctx.save();
  if(shake>0)ctx.translate(Math.round(rnd(-2.5,2.5)),Math.round(rnd(-2.5,2.5)));
  if(bg){
    ctx.drawImage(bg.sky,0,0);
    const ox=-Math.floor((scroll*0.25)%W);
    ctx.drawImage(bg.far,ox,0);ctx.drawImage(bg.far,ox+W,0);
    for(let x=-Math.floor(scroll%24);x<W;x+=24)ctx.drawImage(bg.tile,x,GY);
  }

  // Nuvole visibili SOLO se boss non attivo
  if(level===11&&!boss){
    const cloudAlpha=p.onCloud?Math.min(1,Math.max(0.25,p.cloudTimer/60)):1;
    for(let cx=-Math.floor((scroll*0.8)%36);cx<W;cx+=36){
      ctx.fillStyle='rgba(254,240,138,'+(0.92*cloudAlpha)+')';
      ctx.fillRect(cx+4,CLOUD_Y,26,6);
      ctx.fillStyle='rgba(255,255,255,'+cloudAlpha+')';
      ctx.fillRect(cx+8,CLOUD_Y-3,18,4);
    }
  }

  for(const i of items){
    const bob=Math.sin((fN+i.x)/8)*2;
    if(i.t==='oscar'){
      if(fN%10<5){ctx.fillStyle='rgba(251,191,36,0.3)';ctx.fillRect(Math.round(i.x)-2,Math.round(i.y+bob)-2,i.w+4,i.h+4);}
      ctx.font='bold 7px "Courier New",monospace';ctx.fillStyle='#fef08a';ctx.fillText('OSCAR',Math.round(i.x)-2,Math.round(i.y+bob)-8);
    }else if(i.t==='clap'){
      ctx.fillStyle=['#ef4444','#f59e0b','#22c55e','#38bdf8','#a855f7'][Math.floor(fN/4)%5];
      ctx.fillRect(Math.round(i.x)-3,Math.round(i.y+bob)-3,i.w+6,i.h+6);
      ctx.font='bold 7px "Courier New",monospace';ctx.fillStyle='#ffffff';ctx.fillText('3D!',Math.round(i.x)+4,Math.round(i.y+bob)-9);
    }
    ctx.drawImage(i.s,Math.round(i.x),Math.round(i.y+bob));
  }
  for(const o of obs)ctx.drawImage(o.s,Math.round(o.x),Math.round(o.y));
  if(boss&&bossS){
    ctx.drawImage(bossS,Math.round(boss.x),Math.round(boss.y));
    ctx.font='bold 7px "Courier New",monospace';ctx.fillStyle='#fde047';
    ctx.fillText(LV[level-1].boss.toUpperCase(),Math.round(boss.x)-6,Math.round(boss.y)-10);
    if(boss.hp!==undefined&&boss.maxHp){
      const barW=44;
      const barX=boss.x+(boss.w-barW)/2;
      const barY=boss.y-18;
      ctx.fillStyle='#000000';
      ctx.fillRect(Math.round(barX)-1,barY-1,barW+2,5);
      ctx.fillStyle='#ef4444';
      ctx.fillRect(Math.round(barX),barY,Math.round(barW*boss.hp/boss.maxHp),3);
      ctx.fillStyle='#000000';
      for(let i=1;i<boss.maxHp;i++){
        ctx.fillRect(Math.round(barX+barW*i/boss.maxHp),barY,1,3);
      }
    }
  }

  const G=inv>0,s=G?pl4:pl2,ph0=G?48:24,sw=Math.max(8,ph0-(GY-(p.y+ph0))/4);
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(Math.round(p.x+(ph0-sw)/2),(p.onCloud?CLOUD_Y:GY)-1,Math.round(sw),3);
  if(!(hurt>0&&fN%6<3)&&s){
    if(G&&fN%8<4){ctx.fillStyle='rgba(255,216,74,0.55)';ctx.fillRect(p.x-3,Math.round(p.y)-3,s.width+6,s.height+6);}
    ctx.drawImage(s,p.x,Math.round(p.y));
  }

  if(mode==='play'||mode==='countdown'){
    cy+=(p.y-4-cy)*0.14;
    if(hlpS)ctx.drawImage(hlpS,Math.max(4,p.x-24),Math.round(cy+Math.sin(fN/9)*2));
    const maxJ=(level===11)?3:2;
    for(let i=0;i<maxJ;i++){
      ctx.fillStyle=i<(maxJ-p.j)?'#22c55e':'#94a3b8';
      ctx.fillRect(Math.round(p.x+ph0/2-(maxJ*3.5)+i*7),Math.round(p.y)-7,5,3);
    }
  }
  for(const q of parts){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),2,2);}
  ctx.font='bold 9px "Courier New",monospace';
  for(const q of pops){ctx.fillStyle='#ffffff';ctx.fillText(q.t,Math.round(q.x)+1,Math.round(q.y)+1);ctx.fillStyle=q.c||'#d97706';ctx.fillText(q.t,Math.round(q.x),Math.round(q.y));}

  const L=LV[level-1],rM=isPortrait?6:58,tO=isPortrait?28:6;
  ctx.textBaseline='top';ctx.font='bold 9px "Courier New",monospace';
  ctx.fillStyle='rgba(255,255,255,0.88)';ctx.fillRect(4,4,158,54);
  ctx.strokeStyle='#142238';ctx.strokeRect(4,4,158,54);
  ctx.fillStyle='#142238';ctx.fillText('PT '+String(score()).padStart(5,'0'),8,7);
  ctx.fillStyle='#b91c1c';ctx.fillText('SAGA '+level+'/'+LV.length+' · VEL '+Math.round(speed*40),8,18);
  ctx.fillStyle='#0b65c6';ctx.fillText(L.n.slice(0,18).toUpperCase(),8,29);
  ctx.fillStyle='#142238';ctx.fillRect(8,41,104,5);ctx.fillStyle='#22c55e';ctx.fillRect(9,42,Math.min(102,Math.round(ls*0.102)),3);
  ctx.fillStyle='#142238';ctx.fillRect(8,49,104,5);
  if(inv>0){
    ctx.fillStyle=fN%6<3?'#ffd84a':'#ef4444';ctx.fillRect(9,50,Math.max(0,Math.round((inv/invMax)*102)),3);
    ctx.fillStyle='#d92638';ctx.fillText('SUPER',115,47);
  }else{ctx.fillStyle='#cbd5e1';ctx.fillRect(9,50,102,3);}

  ctx.fillStyle='rgba(255,255,255,0.88)';ctx.fillRect(W-rM-82,tO-2,82,38);ctx.strokeRect(W-rM-82,tO-2,82,38);
  for(let i=0;i<lives;i++)ctx.drawImage(S.heartHud,W-rM-4-(i+1)*14,tO);
  ctx.textAlign='right';ctx.fillStyle='#b45309';ctx.fillText('POP x'+String(bits).padStart(3,'0'),W-rM-4,tO+14);
  ctx.drawImage(S.oscarHud,W-rM-66,tO+23);ctx.fillStyle='#b91c1c';ctx.fillText('OSCAR '+(oscarCount%3)+'/3',W-rM-4,tO+25);

  ctx.textAlign='center';
  if(msgT>0){ctx.fillStyle='#142238';ctx.fillText(msg,W/2+1,Math.max(72,GY-105)+1);ctx.fillStyle='#fde047';ctx.fillText(msg,W/2,Math.max(72,GY-105));}
  ctx.textAlign='left';ctx.restore();
}

function show(html){
  ov.innerHTML='<div class="panel">'+html+'</div>';
  ov.style.display='flex';
}
function menu(){
  mode='menu';pauseBtn.style.display='none';pendingQuiz=false;
  show(`<h1>🎬 CINE SAGA RUNNER</h1>
  <p>Vivi <b>10 Saghe Cinematografiche + 1 Livello Finale Segreto</b>!</p>
  <p>Difficoltà crescente: ogni film è più veloce con il suo Boss finale!</p>
  <button type="button" data-a="start">AZIONE! (GIOCA)</button>
  <button type="button" data-a="mute">AUDIO: ${muted?'OFF':'ON'}</button><br>
  <input id="pw" maxlength="12" placeholder="CODICE SAGA" autocomplete="off" autocapitalize="characters">
  <button type="button" data-a="pw">VAI ALLA SAGA</button>
  <p class="err" id="er"></p>`);
}

function startQuizCountdown(){
  if(mode!=='play')return;
  mode='countdown';pauseBtn.style.display='none';cdTimer=3;
  const L=LV[level-1];
  const render=()=>{if(mode!=='countdown')return;show(`<h1>CINE-QUIZ!</h1><p>Saga ${level}: ${L.n}</p><div class="cnt">${cdTimer}</div>`);};
  render();snd(523,.12,'square',.08);
  const iv=setInterval(()=>{
    if(mode!=='countdown'){clearInterval(iv);return;}
    cdTimer--;
    if(cdTimer>0){snd(523,.12,'square',.08);render();}
    else{clearInterval(iv);snd(784,.18,'square',.1);showQuiz();}
  },850);
}
function showQuiz(){
  mode='quiz';pendingQuiz=false;
  const L=LV[level-1];
  qopts=L.o.map((t,i)=>({t,ok:i===0})).sort(()=>Math.random()-0.5);
  qLockUntil=performance.now()+550;
  show(`<h1>QUIZ SAGA ${level}</h1><p>${L.n}</p><p>${L.q}</p>`+qopts.map((o,i)=>`<button type="button" class="opt qbtn" disabled data-a="q" data-v="${i}">${'ABC'[i]}) ${o.t}</button>`).join(''));
  setTimeout(()=>{document.querySelectorAll('.qbtn').forEach(b=>b.disabled=false);},550);
}
function levelClear(){
  bank+=1000;ls=0;
  if(level>=LV.length){
    mode='over';pauseBtn.style.display='none';
    show(`<h1>🏆 LEGGENDA DEL CINEMA!</h1><p>Hai completato tutte le 10 Saghe + il Livello Impossibile!</p><p>PUNTEGGIO FINALE: ${score()}</p>${stats()}<button type="button" data-a="again">RIGIOCA</button><button type="button" data-a="menu">MENU</button>`);
    return;
  }
  mode='clear';pauseBtn.style.display='none';
  const nextInfo=(level===10)?`<p style="color:#d92638">⚠️ Sbloccato il <b>LIVELLO 11 FINALE IMPOSSIBILE</b>!<br>Sopravvivi. Scopri. Sorprenditi.</p>`:`<p>Prossimo film: <b>${LV[level].n}</b> (Boss: ${LV[level].boss})</p>`;
  show(`<h1>SAGA ${level} SUPERATA!</h1>${nextInfo}<p>Codice di sblocco:</p><div class="code">${pw(level+1)}</div><br><button type="button" data-a="next">PROSSIMO LIVELLO</button>`);
}
function gameOver(){
  mode='over';pauseBtn.style.display='none';pendingQuiz=false;
  show(`<h1>FINE RIPRESE</h1><p>PUNTI: ${score()} &middot; SAGA ${level} (${LV[level-1].n})</p>${stats()}`+(level>1?`<p>Codice saga:</p><div class="code">${pw(level)}</div><br>`:'')+`<button type="button" data-a="again">RIGIOCA DA CAPO</button><button type="button" data-a="retry">RIPROVA SAGA ${level}</button><button type="button" data-a="menu">MENU</button>`);
}

let prevMode='play',lastActionTime=0;
function dispatchAction(b){
  if(!b)return;
  const now=performance.now();
  if(now-lastActionTime<120)return;
  lastActionTime=now;
  initAudio();
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='q'&&performance.now()<qLockUntil)return;
  snd(620,.05,'square',.08);
  if(a==='mute'){muted=!muted;b.textContent='AUDIO: '+(muted?'OFF':'ON');if(!muted)snd(600,.1,'square',.08);}
  else if(a==='start')startGame(1);
  else if(a==='retry')startGame(level);
  else if(a==='pw'){
    const pwEl=document.getElementById('pw');
    const c=(pwEl?pwEl.value:'').trim().toUpperCase();
    let f=0;
    for(let l=2;l<=LV.length;l++)if(pw(l)===c){f=l;break;}
    if(f)startGame(f);
    else{const errEl=document.getElementById('er');if(errEl)errEl.textContent='Codice non valido!';}
  }
  else if(a==='q'){
    if(qopts[v]&&qopts[v].ok){arp([523,659,784,1047],.12,85);levelClear();}
    else{
      snd(150,.35,'sawtooth',.12,65);
      lives--;lost++;combo=0;
      if(lives<=0)return gameOver();
      show(`<h1 class="err">CIAK ERRATO!</h1><p>Risposta esatta: <b>${LV[level-1].o[0]}</b></p><button type="button" data-a="resume">CONTINUA</button>`);
    }
  }
  else if(a==='unpause'){mode=prevMode;ov.style.display='none';pauseBtn.style.display='block';}
  else if(a==='resume'){ls=880;obs=[];items=[];hurt=65;mode='play';pendingQuiz=false;ov.style.display='none';pauseBtn.style.display='block';}
  else if(a==='next'){level++;startLevel();}
  else if(a==='again')startGame(1);
  else if(a==='menu')menu();
}

ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){e.preventDefault();dispatchAction(b);}});

function pauseGame(){
  if(mode!=='play'&&mode!=='temple')return;
  prevMode=mode;mode='pause';pauseBtn.style.display='none';
  show(`<h1>IN PAUSA</h1><button type="button" data-a="unpause">RIPRENDI</button><button type="button" data-a="menu">MENU</button>`);
}
pauseBtn.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();pauseGame();});

let touchStartData=null;
cv.addEventListener('pointerdown',e=>{
  if(mode==='menu'||mode==='pause'||mode==='quiz'||mode==='over'||mode==='clear'||mode==='countdown')return;
  e.preventDefault();
  initAudio();
  if(mode==='play'){jump();}
  else if(mode==='temple'){
    const rect=cv.getBoundingClientRect();
    const rx=(e.clientX-rect.left)*(W/Math.max(1,rect.width));
    const ry=(e.clientY-rect.top)*(H/Math.max(1,rect.height));
    const btnTop=isPortrait?Math.round(H*0.82):Math.round(H*0.84);
    if(ry>=btnTop){
      const btnW=Math.floor((W-16)/5);
      const idx=Math.min(4,Math.max(0,Math.floor((rx-4)/(btnW+2))));
      templeAction(['left','center','up','down','right'][idx]);
      return;
    }
    touchStartData={x:e.clientX,y:e.clientY,cx:rx,cy:ry,done:false};
  }
});
cv.addEventListener('pointermove',e=>{
  if(mode!=='temple'||!touchStartData||touchStartData.done)return;
  const dx=e.clientX-touchStartData.x,dy=e.clientY-touchStartData.y;
  if(Math.hypot(dx,dy)>12){
    touchStartData.done=true;
    if(Math.abs(dx)>Math.abs(dy))templeAction(dx<0?'left':'right');
    else templeAction(dy<0?'up':'down');
  }
});
cv.addEventListener('pointerup',e=>{
  if(mode==='temple'&&touchStartData&&!touchStartData.done){
    if(touchStartData.cx<W*0.36)templeAction('left');
    else if(touchStartData.cx>W*0.64)templeAction('right');
    else templeAction('up');
  }
  touchStartData=null;
});
cv.addEventListener('pointercancel',()=>{touchStartData=null;});

window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  initAudio();
  if(e.code==='KeyP'){
    if(mode==='play'||mode==='temple')pauseGame();
    else if(mode==='pause'){mode=prevMode;ov.style.display='none';pauseBtn.style.display='block';}
  }
  if(e.code==='KeyM')muted=!muted;
  if(mode==='play'&&(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')){e.preventDefault();jump();}
  else if(mode==='temple'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();templeAction('left');}
    else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();templeAction('right');}
    else if(e.code==='KeyC'){e.preventDefault();templeAction('center');}
    else if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){e.preventDefault();templeAction('up');}
    else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();templeAction('down');}
  }
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&(mode==='play'||mode==='temple'))pauseGame();
});

function frame(t){
  requestAnimationFrame(frame);
  let delta=(t-last)/16.6667;
  last=t;
  delta=Math.max(0.5,Math.min(delta,2));
  if(mode==='play')update(delta);
  else if(mode==='temple')updateTemple(delta);
  else if(mode==='menu'||mode==='over')scroll+=0.55*delta;
  draw();
}

resize();
setupSprites();
menu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
